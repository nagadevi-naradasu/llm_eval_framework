[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "llm-eval"
version = "0.1.0"
description = "A comprehensive framework for evaluating LLM applications."
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "llm_eval", from = "src"}]

[tool.poetry.dependencies]
python = "^3.9"
typer = {extras = ["all"], version = "0.9.0"}
click = "<8.1.0"
pydantic = "^2.5.0"
pandas = "^2.1.0"
numpy = "^1.26.0"
matplotlib = "^3.8.0"
seaborn = "^0.13.0"
openai = "^1.3.0"
anthropic = "^0.7.0"
nltk = "^3.8.1"
rouge-score = "^0.1.2"
bert-score = "^0.3.13"
torch = {version = "^2.0.0", source = "torch-cpu"}
transformers = "^4.30.0"
tqdm = "^4.66.0"
PyYAML = "^6.0.1"

[[tool.poetry.source]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.9.0"
isort = "^5.12.0"
flake8 = "^6.1.0"

[tool.poetry.scripts]
llm-eval = "llm_eval.cli.main:app"
