name: Evaluation Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Download NLTK data
        run: poetry run python -m nltk.downloader punkt

      - name: Run tests
        run: poetry run pytest tests/

      - name: Run evaluation demo
        # We use ' || true' to ensure the workflow doesn't fail if the demo has missing API keys (which returns exit code 0 usually but might fail logic)
        # Actually, our judge metric returns 0.0 on failure, so it shouldn't crash.
        run: poetry run llm-eval run examples/config.yaml --output-dir results/ || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: results/
